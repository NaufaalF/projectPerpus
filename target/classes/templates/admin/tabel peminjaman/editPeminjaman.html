<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Peminjaman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body style="background-color: #f0ecec;">
    <script src="https://kit.fontawesome.com/808ba9c7d8.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light py-3" style="background-color: #11007e;">
        <div class="container-fluid px-5">
            <a href="/dashboard">
                <i class="fa-solid fa-chart-line logo-book"></i>
            </a>
            <h3 class="text-white fw-bold" style="margin-bottom: 0px;">Dashboard</h3>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" id="profilDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <span th:if="${#authorization.expression('isAuthenticated()')}"
                                th:text="${#authentication.name}">Profil</span>
                            <span th:if="${#authorization.expression('isAnonymous()')}">Profil</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profilDropdown">
                            <li th:if="${#authorization.expression('isAnonymous()')}">
                                <a class="dropdown-item" href="/login">Login</a>
                            </li>
                            <li th:if="${#authorization.expression('isAnonymous()')}">
                                <a class="dropdown-item" href="/register">Register</a>
                            </li>
                            <li th:if="${#authorization.expression('isAuthenticated()')}">
                                <form th:action="@{/logout}" method="post">
                                    <button class="dropdown-item" type="submit">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="container d-flex align-items-center" style="height: 90vh;">
        <div class="container border-0 shadow-sm container-upload-peminjaman">
            <div class="row" style="margin: 10px;">
                <div class="container d-flex justify-content-center mb-5">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <i class="fa-solid fa-bookmark logo-book fa-4x" style="color: #11007e; width: 50px;"></i>
                        </div>
                        <div class="col" style="max-width:max-content;">
                            <h1 class="fw-bold" style="padding-bottom: 0; color: #11007e;">Edit Peminjaman</h1>
                        </div>
                    </div>
                </div>

                <!-- Pesan Error -->
                <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                    <p th:text="${errorMessage}"></p>
                </div>
                <!-- Pesan Sukses -->
                <div th:if="${successMessage}" class="alert alert-success" role="alert">
                    <p th:text="${successMessage}"></p>
                </div>

                <!-- Form -->
                <form th:action="@{'/edit-peminjaman/' + ${peminjaman.id}}" method="post">

                    <!-- ID Anggota -->
                    <div class="mb-3 row">
                        <label for="anggota_id" class="col-sm-3 col-form-label fw-bold">ID Anggota</label>
                        <div class="col-sm-9">
                            <select class="form-control" id="anggota_id" name="anggota_id" required>
                                <option value="" disabled>Pilih Anggota</option>
                                <option th:each="anggota : ${daftarAnggota}"
                                        th:value="${anggota.id}"
                                        th:text="${anggota.id + ' - ' + anggota.name}"
                                        th:selected="${anggota.id == peminjaman.anggota.id}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- ID Buku -->
                    <div class="mb-3 row">
                        <label for="buku_id" class="col-sm-3 col-form-label fw-bold">ID Buku</label>
                        <div class="col-sm-9">
                            <select class="form-control" id="buku_id" name="buku_id" required>
                                <option value="" disabled>Pilih Buku</option>
                                <option th:each="buku : ${daftarBuku}"
                                        th:value="${buku.id}"
                                        th:text="${buku.id + ' - ' + buku.title}"
                                        th:selected="${buku.id == peminjaman.buku.id}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- Tanggal Pinjam -->
                    <div class="mb-3 row">
                        <label for="tanggal_pinjam" class="col-sm-3 col-form-label fw-bold">Tanggal Pinjam</label>
                        <div class="col-sm-9">
                            <input type="date" class="form-control" id="tanggal_pinjam" name="tanggal_pinjam"
                                   th:value="${peminjaman.tanggal_pinjam}" required>
                        </div>
                    </div>

                    <!-- Tanggal Kembali -->
                    <div class="mb-3 row">
                        <label for="tanggal_kembali" class="col-sm-3 col-form-label fw-bold">Tanggal Kembali</label>
                        <div class="col-sm-9">
                            <input type="date" class="form-control" id="tanggal_kembali" name="tanggal_kembali"
                                   th:value="${peminjaman.tanggal_kembali}">
                        </div>
                    </div>

                    <!-- Status -->
                    <div class="mb-3 row">
                        <label for="status_peminjaman" class="col-sm-3 col-form-label fw-bold">Status</label>
                        <div class="col-sm-9">
                            <select class="form-control" id="status_peminjaman" name="status_peminjaman" required>
                                <option value="MENUNGGU" th:selected="${peminjaman.status_peminjaman == 'MENUNGGU'}">MENUNGGU</option>
                                <option value="DIPINJAM" th:selected="${peminjaman.status_peminjaman == 'DIPINJAM'}">DIPINJAM</option>
                                <option value="SELESAI" th:selected="${peminjaman.status_peminjaman == 'SELESAI'}">SELESAI</option>
                            </select>
                        </div>
                    </div>

                    <div class="text-end">
                        <a href="/tabel-peminjaman" class="btn btn-danger text-white">Cancel</a>
                        <button type="submit" class="btn text-white" style="background-color: #11007e;">Update Peminjaman</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
