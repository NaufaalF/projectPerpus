<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Detail Buku: ' + ${buku.title}">Detail Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://kit.fontawesome.com/808ba9c7d8.js" crossorigin="anonymous"></script>
</head>
<body style="background-color: 		#f0ecec;">
    <!-- Bootstrap Bundle with Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/808ba9c7d8.js" crossorigin="anonymous"></script>
    <nav class="navbar navbar-expand-lg navbar-light py-3" style="background-color: #55c300;">
        <div class="container-fluid px-5">
            <a href="/home">
                <i class="fa-solid fa-book logo-book"></i>
            </a>
            <h3 class="text-white fw-bold" style="margin-bottom: 0px;" href="#">Perpustakaan</h3>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/peminjaman">Peminjaman</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/pengembalian">Pengembalian</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" id="profilDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <span th:if="${#authorization.expression('isAuthenticated()')}"
                                th:text="${#authentication.name}">Profil</span>
                            <span th:if="${#authorization.expression('isAnonymous()')}">Profil</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profilDropdown">
                            <!-- Jika belum login -->
                            <li th:if="${#authorization.expression('isAnonymous()')}">
                                <a class="dropdown-item" href="/login">Login</a>
                            </li>
                            <li th:if="${#authorization.expression('isAuthenticated()')}">
                                <form th:action="@{/logout}" method="post">
                                    <button class="dropdown-item" type="submit">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5 border-0 shadow-sm container-detail-buku">
        <div class="row p-3">
            <div class="col-md-4" style="width: 380px;">
                <img th:src="@{'/cover/' + ${buku.id}}" class="img-fluid rounded" alt="Cover Buku" style="width: 380px; height: 530px;">
                <div class="d-grid gap-2 mt-3">
                    <button class="btn text-white" type="button" style="background-color: #55c300;">
                        <i class="fa-solid fa-bookmark gap-2"></i>
                        Pinjam</button>
                </div>
            </div>
            <div class="col-md-8">
                <h2 class="fw-bold" style="margin-bottom: 16px;" th:text="${buku.title}">Judul Buku</h2>
                <p><span class="fw-bold">Penulis:</span> <span th:text="${buku.author}"></span></p>
                <p><span class="fw-bold">Penerbit:</span> <span th:text="${buku.publisher}"></span></p>
                <p><span class="fw-bold">Tahun Terbit:</span> <span th:text="${buku.year}"></span></p>
                <p><span class="fw-bold">Kategori:</span> <span th:text="${buku.category}"></span></p>
                <p><span class="fw-bold">Lokasi Rak:</span> <span th:text="${buku.lokasi_rak}"></span></p>
                <p class="fw-bold mt-3 mb-1">Deskripsi Buku:</p>
                <p th:text="${buku.description}">Deskripsi buku akan muncul di sini.</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="container-fluid bg-light text-center py-3">
            <p class="mb-0">© 2023 Bangla Library. All rights reserved.</p>
            <p>Created by <a href="#" class="text-decoration-none">Your Name</a></p>
        </div>
    </footer>
</body>
</html>
