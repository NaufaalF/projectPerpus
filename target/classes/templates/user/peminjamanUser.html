<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Peminjaman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://kit.fontawesome.com/808ba9c7d8.js" crossorigin="anonymous"></script>
</head>

<body style="background-color: 		#f0ecec;">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/808ba9c7d8.js" crossorigin="anonymous"></script>
    <nav class="navbar navbar-expand-lg navbar-light py-3" style="background-color: #55c300;">
        <div class="container-fluid px-5">
            <a href="/home">
                <i class="fa-solid fa-book logo-book"></i>
            </a>
            <h3 class="text-white fw-bold" style="margin-bottom: 0px;" href="#">Perpustakaan</h3>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Peminjaman</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/pengembalian">Pengembalian</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" id="profilDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <span th:if="${#authorization.expression('isAuthenticated()')}"
                                th:text="${#authentication.name}">Profil</span>
                            <span th:if="${#authorization.expression('isAnonymous()')}">Profil</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profilDropdown">
                            <!-- Jika belum login -->
                            <li th:if="${#authorization.expression('isAnonymous()')}">
                                <a class="dropdown-item" href="/login">Login</a>
                            </li>
                            <li th:if="${#authorization.expression('isAuthenticated()')}">
                                <form th:action="@{/logout}" method="post">
                                    <button class="dropdown-item" type="submit">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
    <div th:each="peminjaman : ${daftarPeminjaman}" class="release-card">
        <div class="release-cover">
            <img th:src="@{'/cover/' + ${peminjaman.buku.id}}" alt="Cover" style="margin-left: 15px;">
        </div>
        <div class="release-info">
            <div class="release-title" th:text="${peminjaman.buku.title}"></div>
            <div class="release-subtitle">
                <span th:text="'ID: ' + ${peminjaman.id}"></span> |
                <span th:text="'Pinjam: ' + ${peminjaman.tanggal_pinjam}"></span> |
                <span th:text="'Kembali: ' + ${peminjaman.tanggal_kembali}"></span>
            </div>
            <div class="release-subtitle" th:text="'Status: ' + ${peminjaman.status_peminjaman}"></div>
        </div>
    </div>
</div>


</body>

</html>
