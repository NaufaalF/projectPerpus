<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

    </style>
</head>
<body>
    <div class="container-fluid" style="padding: 0px;">
        <div class="row full-height">
            <!-- Kolom kiri -->
            <div class="col-md-6 left-column">
                <div class="left-column-content">
                    <h2 class="fw-bold">Selamat Datang</h2>
                    <p>Silakan login untuk melanjutkan ke sistem kami.</p>
                </div>
            </div>

            <!-- Kolom kanan -->
            <div class="col-md-6 right-column">
                <div class="login-box">
                    <h2 class="mb-4 d-flex justify-content-center">Login</h2>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username">Username:</label>
                            <input type="text" name="username" id="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="password">Password:</label>
                            <input type="password" name="password" id="password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn w-100 text-white" style="background-color: #55c300;">Login</button>
                    </form>
                    <p class="mt-3 text-center">Belum punya akun? <a th:href="@{/register}">Daftar di sini</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
