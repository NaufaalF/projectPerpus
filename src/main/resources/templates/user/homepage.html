<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: 		#f0ecec;">
    <script src="https://kit.fontawesome.com/808ba9c7d8.js" crossorigin="anonymous"></script>
    <nav class="navbar navbar-expand-lg navbar-light py-3" style="background-color: #55c300;">
        <div class="container-fluid px-5">
            <a href="#">
                <i class="fa-solid fa-book logo-book"></i>
            </a>
            <h3 class="text-white fw-bold" style="margin-bottom: 0px;" href="#">Perpustakaan</h3>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/peminjaman">Peminjaman</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/pengembalian">Pengembalian</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/login">Login</a>
                </ul>
            </div>
        </div>
    </nav>

    <div class="library-image-container">
        <img src="images/library.jpg" alt="rak buku" class="library-image">   
        <div class="position-absolute top-50 start-50 translate-middle text-center text-white">
            <h1 class="display-4 fw-bold">WELCOME<br>TO<br>BANGLA LIBRARY</h1>
            <p class="lead">Lorem Ipsum is simply dummy text of the printing and typesetting industry.</p>
            <button class="btn btn-light mt-3" onclick="document.getElementById('most-popular').scrollIntoView({ behavior: 'smooth' });">GET STARTED</button>
        </div>
    </div>

    <div class="container mt-4" id="most-popular">
        <span class="fw-bold">LIST BUKU</span>
        <div class="row mt-3">
            <div class="col-4 col-md-2 mb-4" style="max-height: 348.4px;" th:each="item : ${buku}">
                <a th:href="@{'home/buku/' + ${item.id}}" class="text-decoration-none text-dark">
                    <div class="card border-0 shadow-sm h-100 book-container">
                        <div class="ratio-2x3">
                            <img th:src="@{'/cover/' + ${item.id}}" class="card-img-top" alt="Cover Buku" />
                        </div>
                        <div class="card-body text-center">
                            <h6 th:text="${item.title}" class="fw-bold mb-1"></h6>
                            <small th:text="${item.author}" class="text-muted"></small>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <footer>
        <div class="container-fluid bg-light text-center py-3" >
            <p class="mb-0">© 2023 Bangla Library. All rights reserved.</p>
            <p>Created by <a href="#" class="text-decoration-none">Your Name</a></p>
        </div>
    </footer>
</body>
</html>
