<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Detail Buku: ' + ${buku.title}">Detail Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: 		#f0ecec;">
    <script src="https://kit.fontawesome.com/808ba9c7d8.js" crossorigin="anonymous"></script>
    <nav class="navbar navbar-expand-lg navbar-light py-3" style="background-color: #55c300;">
        <div class="container-fluid px-5">
            <a href="/home">
                <i class="fa-solid fa-book logo-book"></i>
            </a>
            <h3 class="text-white fw-bold" style="margin-bottom: 0px;" href="#">Perpustakaan</h3>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/peminjaman">Peminjaman</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/pengembalian">Pengembalian</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5 border-0 shadow-sm container-detail-buku">
        <div class="row">
            <div class="col-md-4" style="width: 380px;">
                <img th:src="@{'/cover/' + ${buku.id}}" class="img-fluid rounded" alt="Cover Buku" style="width: 380px; height: 530px;">
                <div class="d-grid gap-2 mt-3">
                    <button class="btn text-white" type="button" style="background-color: #55c300;">
                        <i class="fa-solid fa-bookmark gap-2"></i>
                        Pinjam</button>
                </div>
            </div>
            <div class="col-md-8">
                <h2 th:text="${buku.title}">Judul Buku</h2>
                <h5 class="text-muted" th:text="'Penulis: ' + ${buku.author}">Penulis</h5>
                <h5 class="text-muted" th:text="'Penerbit: ' + ${buku.publisher}">Penerbit</h5>
                <h5 class="text-muted" th:text="'Tahun Terbit: ' + ${buku.year}">Tahun Terbit</h5>
                <h5 class="text-muted" th:text="'Kategori: ' + ${buku.category}">Kategori</h5>
                <h5 class="text-muted" th:text="'Lokasi Rak: ' + ${buku.lokasi_rak}">Lokasi Rak</h5>
                <h5 class="text-muted">Deskripsi Buku:</h5>
                <p th:text="${buku.description}">Deskripsi buku akan muncul di sini.</p>

                <!-- <p th:text="${buku.description}">Deskripsi buku akan muncul di sini.</p>
                <p><strong>Genre:</strong> <span th:text="${buku.genre}">Genre</span></p>
                <p><strong>Tahun Terbit:</strong> <span th:text="${buku.year}">2023</span></p> -->
                <!-- Tambahkan atribut lainnya sesuai dengan field di entity Buku -->
            </div>
        </div>
    </div>

    <footer>
        <div class="container-fluid bg-light text-center py-3">
            <p class="mb-0">© 2023 Bangla Library. All rights reserved.</p>
            <p>Created by <a href="#" class="text-decoration-none">Your Name</a></p>
        </div>
    </footer>
</body>
</html>
