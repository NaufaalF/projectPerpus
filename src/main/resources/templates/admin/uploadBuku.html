<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form th:action="@{/upload}" method="post" enctype="multipart/form-data">
    <input type="text" name="title" placeholder="Judul" required>
    <input type="text" name="author" placeholder="Penulis" required>
    <input type="text" name="genre" placeholder="Genre" required>
    <input type="text" name="year" placeholder="Tahun Terbit" required>
    <textarea name="description" placeholder="Deskripsi" required></textarea>
    <input type="text" name="publisher" placeholder="Penerbit" required>
    <input type="text" name="category" placeholder="Kategori" required>
    <input type="text" name="lokasi_rak" placeholder="Lokasi Rak" required>
    <input type="file" name="cover" accept="image/*" required>
    <button type="submit">Upload Buku</button>
</form>
</body>
</html>
