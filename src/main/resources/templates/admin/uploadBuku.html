<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: 		#f0ecec;">
    <script src="https://kit.fontawesome.com/808ba9c7d8.js" crossorigin="anonymous"></script>
    <nav class="navbar navbar-expand-lg navbar-light py-3" style="background-color: #55c300;">
        <div class="container-fluid px-5">
            <a href="/home">
                <i class="fa-solid fa-book logo-book"></i>
            </a>
            <h3 class="text-white fw-bold" style="margin-bottom: 0px;" href="#">Perpustakaan</h3>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/peminjaman">Peminjaman</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/pengembalian">Pengembalian</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5 border-0 shadow-sm container-detail-buku" style="width: 50%; height: 660px;">
        <div class="row" style="margin: 10px;">
            <div class="col-md-12 text-center mb-3">
                <h2 class="fw-bold">Upload Buku</h2>
                <p>Silakan isi informasi buku yang ingin diupload.</p>
            </div>

            <form th:action="@{/upload}" method="post" enctype="multipart/form-data">
                <div class="mb-3 row">
                    <label for="title" class="col-sm-3 col-form-label fw-bold">Judul Buku</label>
                    <div class="col-sm-9">
                    <input type="text" class="form-control" id="title" name="title" placeholder="Judul" required>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="author" class="col-sm-3 col-form-label fw-bold">Penulis</label>
                    <div class="col-sm-9">
                    <input type="text" class="form-control" id="author" name="author" placeholder="Penulis" required>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="publisher" class="col-sm-3 col-form-label fw-bold">Penerbit</label>
                    <div class="col-sm-9">
                    <input type="text" class="form-control" id="publisher" name="publisher" placeholder="Penerbit" required>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="year" class="col-sm-3 col-form-label fw-bold">Tahun Terbit</label>
                    <div class="col-sm-9">
                    <input type="text" class="form-control" id="year" name="year" placeholder="Tahun Terbit" required>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="category" class="col-sm-3 col-form-label fw-bold">Kategori</label>
                    <div class="col-sm-9">
                    <input type="text" class="form-control" id="category" name="category" placeholder="Kategori" required>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="lokasi_rak" class="col-sm-3 col-form-label fw-bold">Lokasi Rak</label>
                    <div class="col-sm-9">
                    <input type="text" class="form-control" id="lokasi_rak" name="lokasi_rak" placeholder="Lokasi Rak" required>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="description" class="col-sm-3 col-form-label fw-bold">Deskripsi</label>
                    <div class="col-sm-9">
                    <textarea class="form-control" id="description" name="description" placeholder="Deskripsi" rows="3" required></textarea>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="cover" class="col-sm-3 col-form-label fw-bold">Cover</label>
                    <div class="col-sm-9">
                    <input type="file" class="form-control" id="cover" name="cover" accept="image/*" required>
                    </div>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary">Upload Buku</button>
                </div>
            </form>
        </div>
    </div>
    <footer>
        <div class="container-fluid bg-light text-center py-3">
            <p class="mb-0">© 2023 Bangla Library. All rights reserved.</p>
            <p>Created by <a href="#" class="text-decoration-none">Your Name</a></p>
        </div>
    </footer>
</body>
</html>
